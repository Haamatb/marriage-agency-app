name: marriage_agency_app
description: "تطبيق توثيق الزواجات والوكالات الشرعية"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Firebase ──────────────────────────────────────────────
  firebase_core: ^3.3.0
  cloud_firestore: ^5.2.1

  # ── Local Database ────────────────────────────────────────
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  drift: ^2.18.0
  # sqlite3_flutter_libs: ^0.5.22  # Only needed with drift

  # ── Connectivity ──────────────────────────────────────────
  connectivity_plus: ^6.0.3

  # ── Notifications & Background (Android) ─────────────────
  flutter_local_notifications: ^17.2.2
  workmanager: ^0.5.2
  timezone: ^0.9.4

  # ── File System & Archive ─────────────────────────────────
  path_provider: ^2.1.3
  path: ^1.9.0
  archive: ^3.6.1

  # ── Excel Import/Export ───────────────────────────────────
  excel: ^4.0.2

  # ── File Picker ───────────────────────────────────────────
  file_picker: ^8.0.7

  # ── Date / Localization ───────────────────────────────────
  intl: ">=0.19.0 <1.0.0"
  hijri: ^3.0.1

  # ── UUID ─────────────────────────────────────────────────
  uuid: ^4.4.0

  # ── UI Helpers ───────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # ── JSON / Serialization ─────────────────────────────────
  json_annotation: ^4.9.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/templates/

