name: Build Windows Release (.exe)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Enable Windows Desktop
        run: |
          flutter config --enable-windows-desktop
          flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Windows Executable (.exe)
        run: flutter build windows --release

      - name: Package Windows Release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath marriage_agency_app_windows_x64.zip

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarriageAgencyApp-Windows-x64
          path: marriage_agency_app_windows_x64.zip
